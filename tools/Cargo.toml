[workspace]
resolver = "3"
members = ["check"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
jsonschema = { version = "=0.60.2", default-features = false }
serde_json = "=1.0.154"
sha2 = { version = "=0.10.9", default-features = false }
